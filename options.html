<!DOCTYPE html>
<html>
<head>
  <title>Extension Options</title>
  <meta charset="UTF-8">
  <link rel="stylesheet" type="text/css" href="css/options.css" />
</head>
<body>

<div class="page">

  <header class="topbar">
    <div class="brand">
      <span class="brand-logo">🎟️</span>
      <div>
        <div class="brand-name">tikitiki</div>
        <div class="brand-ver" id="ver"></div>
      </div>
    </div>
    <button id="save" class="save-btn">儲存設定</button>
  </header>

  <div id="status" class="toast"></div>

  <main class="sections">

    <section class="card">
      <h2 class="card-title"><span class="card-icon">🎯</span>節目與場次</h2>
      <label class="row">
        <input type="checkbox" id="ProgramOnly" class='option toggle-switch' />
        <span>自動跳過節目介紹頁，直接前往場次列表</span>
      </label>
    </section>

    <section class="card">
      <h2 class="card-title"><span class="card-icon">🪑</span>選區</h2>

      <label class="row">
        <input type="checkbox" id="HideBadArea" class='option toggle-switch' />
        <span>自動隱藏「遮擋」「護網」「鐵網」「不完整」區</span>
      </label>

      <label class="row">
        <input type="checkbox" id="HideDisabledArea" class='option toggle-switch' />
        <span>自動隱藏身障區</span>
      </label>

      <label class="row">
        <input type="checkbox" id="ShowOnlyArea" class='option toggle-switch' />
        <span>僅顯示這些區域，其餘隱藏</span>
      </label>
      <div class="tag-input-row indent">
        <div class="tag-input" id="AreaNameBox">
          <input type="text" id="AreaNameInput" placeholder="輸入區域名稱後按 Enter 新增">
        </div>
        <button type="button" class="clear-btn" id="AreaNameClear">清空</button>
      </div>
      <input type="hidden" id="AreaName">
    </section>

    <section class="card">
      <h2 class="card-title"><span class="card-icon">⚡</span>自動點擊</h2>

      <label class="row">
        <input type="checkbox" id="AutoClickArea" class='option toggle-switch' />
        <span>自動點擊符合關鍵字的區域，不會隱藏其他區域</span>
      </label>
      <div class="tag-input-row indent">
        <div class="tag-input" id="AutoClickAreaNameBox">
          <input type="text" id="AutoClickAreaNameInput" placeholder="留空代表不限區域，輸入後按 Enter 新增">
        </div>
        <button type="button" class="clear-btn" id="AutoClickAreaNameClear">清空</button>
      </div>
      <input type="hidden" id="AutoClickAreaName">

      <div class="subpanel indent">
        <label class="row">
          <input type="checkbox" id="AutoClickAllowInsufficient" class='option toggle-switch' />
          <span>允許點擊票數不足的區域<br><small>不勾選的話，只會點有足夠票數或熱賣中的區域</small></span>
        </label>

        <div class="field-label" style="margin-top:14px;">符合條件的區域有多個時，優先點擊</div>
        <div class="radio-group radio-group-vertical">
          <label class="radio-option"><input type="radio" name="AutoClickTieBreak" value="top">畫面排前面（通常較貴）</label>
          <label class="radio-option"><input type="radio" name="AutoClickTieBreak" value="bottom">畫面排後面（通常較便宜）</label>
          <label class="radio-option"><input type="radio" name="AutoClickTieBreak" value="keyword">關鍵字輸入順序</label>
          <label class="radio-option"><input type="radio" name="AutoClickTieBreak" value="random">隨機</label>
        </div>
      </div>
    </section>

    <section class="card">
      <h2 class="card-title"><span class="card-icon">🎫</span>張數選擇</h2>
      <div class="radio-group">
        <label class="radio-option"><input type="radio" name="TicketNumber" value="0">最大張數</label>
        <label class="radio-option"><input type="radio" name="TicketNumber" value="1">1</label>
        <label class="radio-option"><input type="radio" name="TicketNumber" value="2">2</label>
        <label class="radio-option"><input type="radio" name="TicketNumber" value="3">3</label>
        <label class="radio-option"><input type="radio" name="TicketNumber" value="4">4</label>
      </div>
    </section>

    <section class="card">
      <h2 class="card-title"><span class="card-icon">🔐</span>驗證碼</h2>
      <div class="field-label">自訂字串（銀行自動偵測失敗時使用）</div>
      <input type="text" id="VerifyCode" placeholder="例如信用卡卡號前六碼">
      <div class="hint">目前支援自動偵測的銀行：中信 (418230)、富邦 (552046)、玉山 (524255)</div>
    </section>

  </main>
</div>

<script src="options.js"></script>
</body>
</html>
