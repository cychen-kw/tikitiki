<!DOCTYPE html>
<html>
<head>
  <title>Extension Options</title>
  <meta charset="UTF-8">
  <link rel="stylesheet" type="text/css" href="css/options.css" />
</head>
<body>

<div class="card">
  <h2>tikitiki 設定頁面<span id="ver"></span></h2>

  <div class="group">
    <label class="row">
      <input type="checkbox" id="HideBadArea" class='option' />
      <span>自動隱藏 "遮擋", "護網", "鐵網", "不完整" 區</span>
    </label>
    <label class="row">
      <input type="checkbox" id="ShowOnlyArea" class='option' />
      <span>僅顯示這些區域，名稱用逗點隔開。( Ex. A區,B區 )</span>
    </label>
    <input type="text" id="AreaName" class="indent">
  </div>

  <div class="group">
    <label class="row">
      <input type="checkbox" id="ProgramOnly" class='option' />
      <span>只顯示立即購票視窗。</span>
    </label>
  </div>

  <div class="group">
    <label class="field-label">張數選擇</label>
    <select id="TicketNumber">
      <option value="0">最大張數</option>
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4">4</option>
    </select>
  </div>

  <div class="group">
    <label class="field-label">驗證碼自訂字串（銀行自動偵測失敗時使用）</label>
    <input type="text" id="VerifyCode">
    <div class="hint">目前支援自動偵測的銀行：中信 (418230)、富邦 (552046)、玉山 (524255)</div>
  </div>

  <div class="footer">
    <button id="save">Save</button>
    <span id="status"></span>
  </div>
</div>

<script src="options.js"></script>
</body>
</html>
